cron:
  fields:
    schedule:
      required: true
      example: "0 7 * * 1-5"
      selector:
        text:

stale:
  target:
    entity:
  fields:
    for:
      required: true
      example: "01:00:00"
      selector:
        duration:

integration_failed:
  fields:
    for:
      required: true
      example: "00:15:00"
      selector:
        duration:
    entry_id:
      required: false
      selector:
        config_entry:
repair_issue_created:
  fields:
    domain:
      required: false
      example: hue
      selector:
        text:
          multiple: true
    severity:
      required: false
      selector:
        select:
          multiple: true
          translation_key: repair_issue_severity
          options:
            - critical
            - error
            - warning
repair_issue_removed:
  fields:
    domain:
      required: false
      example: hue
      selector:
        text:
          multiple: true
