boo:
  name: Boo! 👻
  description: >-
    Calling this action spooks Home Assistant.
    Performing this action will always fail.

random_fail:
  name: Random fail 👻
  description: Performing this action will randomly fail.

blueprint_import:
  name: Import blueprint 👻
  description: >-
    Import a blueprint.
  fields:
    url:
      name: URL
      description: The URL to import the blueprint from.
      required: true
      selector:
        text:

automation_snooze:
  name: Snooze 👻
  description: >-
    Turns an automation off for a while, and turns it back on when the time is
    up. It survives a restart of Home Assistant, so a snooze does not quietly
    become a disable.
  target:
    entity:
      domain: automation
  fields:
    duration:
      name: Duration
      description: How long the automation stays off.
      required: true
      example: "01:00:00"
      selector:
        duration:

automation_turn_on_for:
  name: Turn on for 👻
  description: >-
    Turns an automation on for a while, and turns it back off when the time is
    up. It survives a restart of Home Assistant, so "just for tonight" does not
    quietly become forever.
  target:
    entity:
      domain: automation
  fields:
    duration:
      name: Duration
      description: How long the automation stays on.
      required: true
      example: "01:00:00"
      selector:
        duration:

light_set_brightness:
  name: Set brightness 👻
  description: >-
    Sets the brightness of lights that are already on, and leaves the ones
    that are off alone. Groups are adjusted light by light rather than by
    their average.
  target:
    entity:
      domain: light
  fields:
    brightness_pct:
      name: Brightness
      description: The brightness to set, as a percentage.
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: How long the change should take.
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

light_increase_brightness:
  name: Increase brightness 👻
  description: >-
    Turns up the lights that are already on, and leaves the ones that are off
    alone. Each light steps from its own level, so a group keeps its shape
    instead of levelling out.
  target:
    entity:
      domain: light
  fields:
    step_pct:
      name: Step
      description: How much brighter to go, as a percentage.
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: How long the change should take.
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

light_decrease_brightness:
  name: Decrease brightness 👻
  description: >-
    Turns down the lights that are already on, stopping at the dimmest they go
    rather than switching them off. Each light steps from its own level.
  target:
    entity:
      domain: light
  fields:
    step_pct:
      name: Step
      description: How much dimmer to go, as a percentage.
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    transition:
      name: Transition
      description: How long the change should take.
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

light_set_color:
  name: Set color 👻
  description: >-
    Sets the color of lights that are already on, and leaves alone the ones
    that are off or cannot do color.
  target:
    entity:
      domain: light
  fields:
    rgb_color:
      name: Color
      description: The color to set.
      required: true
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    transition:
      name: Transition
      description: How long the change should take.
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

light_set_color_temperature:
  name: Set color temperature 👻
  description: >-
    Sets the color temperature of lights that are already on, each within the
    range it can actually reach.
  target:
    entity:
      domain: light
  fields:
    kelvin:
      name: Color temperature
      description: The color temperature to set.
      required: true
      example: 2700
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    transition:
      name: Transition
      description: How long the change should take.
      example: 2
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds

light_set_effect:
  name: Set effect 👻
  description: >-
    Sets an effect on the lights that are already on and actually have it.
    Effect names differ per manufacturer, so a room is usually a mix.
  target:
    entity:
      domain: light
  fields:
    effect:
      name: Effect
      description: The name of the effect to set.
      required: true
      example: Colorloop
      selector:
        text:

calendar_delete_event:
  name: Delete event 👻
  description: >-
    Deletes events from a calendar, found by their title or uid in a stretch
    of time.
  target:
    entity:
      domain: calendar
      supported_features:
        - calendar.CalendarEntityFeature.DELETE_EVENT
  fields:
    summary:
      required: false
      example: Dentist
      selector:
        text:
    uid:
      required: false
      selector:
        text:
    start_date_time:
      required: false
      example: "2026-10-04 08:00:00"
      selector:
        datetime:
    end_date_time:
      required: false
      example: "2026-10-04 20:00:00"
      selector:
        datetime:
    duration:
      required: false
      selector:
        duration:
    whole_series:
      required: false
      default: false
      selector:
        boolean:

calendar_update_event:
  name: Update event 👻
  description: >-
    Changes events in a calendar, found by their title or uid in a stretch of
    time.
  target:
    entity:
      domain: calendar
      supported_features:
        - calendar.CalendarEntityFeature.UPDATE_EVENT
  fields:
    summary:
      required: false
      example: Dentist
      selector:
        text:
    uid:
      required: false
      selector:
        text:
    start_date_time:
      required: false
      example: "2026-10-04 08:00:00"
      selector:
        datetime:
    end_date_time:
      required: false
      example: "2026-10-04 20:00:00"
      selector:
        datetime:
    duration:
      required: false
      selector:
        duration:
    new_summary:
      required: false
      example: Orthodontist
      selector:
        text:
    description:
      required: false
      selector:
        text:
          multiline: true
    location:
      required: false
      selector:
        text:
    new_start:
      required: false
      selector:
        datetime:
    new_end:
      required: false
      selector:
        datetime:
    shift:
      required: false
      selector:
        duration:
          allow_negative: true

climate_increase_temperature:
  name: Increase temperature 👻
  description: >-
    Turns a thermostat's setpoint up a step, both setpoints for one that heats and cools.
  target:
    entity:
      domain: climate
      supported_features:
        - climate.ClimateEntityFeature.TARGET_TEMPERATURE
        - climate.ClimateEntityFeature.TARGET_TEMPERATURE_RANGE
  fields:
    step:
      required: false
      example: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box

climate_decrease_temperature:
  name: Decrease temperature 👻
  description: >-
    Turns a thermostat's setpoint down a step, both setpoints for one that heats and cools.
  target:
    entity:
      domain: climate
      supported_features:
        - climate.ClimateEntityFeature.TARGET_TEMPERATURE
        - climate.ClimateEntityFeature.TARGET_TEMPERATURE_RANGE
  fields:
    step:
      required: false
      example: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box

homeassistant_create_area:
  name: Create an area 👻
  description: >-
    Creates a new area on the fly.
  fields:
    name:
      name: Name
      description: The name of the area to create.
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: Icon to use for the area.
      required: false
      selector:
        icon:
          placeholder: mdi:texture-box
    aliases:
      name: Aliases
      description: >-
        A list of aliases for the area. This is useful if you want to use the
        area in a different language or different nickname.
      selector:
        object:

homeassistant_add_alias_to_area:
  name: Add an alias to an area 👻
  description: >-
    Adds an alias to an area.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to add the alias to.
      required: true
      selector:
        area:
    alias:
      name: Alias
      description: The alias (or list of aliases) to add to the area.
      required: true
      selector:
        object:

homeassistant_remove_alias_from_area:
  name: Remove an alias from an area 👻
  description: >-
    Removes an alias from an area.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to remove the alias from.
      required: true
      selector:
        area:
    alias:
      name: Alias
      description: The alias (or list of aliases) to remove from the area.
      required: true
      selector:
        object:

homeassistant_set_area_aliases:
  name: Sets aliases for an area 👻
  description: >-
    Sets aliases for an area. Overwrites and removes any existing aliases,
    fully replacing them with the new ones.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to set the aliases for.
      required: true
      selector:
        area:
    aliases:
      name: Aliases
      description: The aliases to set for the area.
      required: true
      selector:
        object:

homeassistant_add_device_to_area:
  name: Add a device to an area 👻
  description: >-
    Adds a device to an area. Please note, if the device is already in an area,
    it will be removed from the previous area.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to add the device to.
      required: true
      selector:
        area:
    device_id:
      name: Device ID
      description: The ID of the device(s) to add to the area.
      required: true
      selector:
        device:
          multiple: true

homeassistant_remove_device_from_area:
  name: Remove a device from an area 👻
  description: >-
    Removes a device from an area. As a device can only be in one area, this
    call doesn't need to specify the area.
  fields:
    device_id:
      name: Device ID
      description: The ID of the device to remove the area from.
      required: true
      selector:
        device:
          multiple: true

homeassistant_add_entity_to_area:
  name: Add an entity to an area 👻
  description: >-
    Adds an entity to an area. Please note, if the entity is already in an area,
    it will be removed from the previous area. This will override the area
    the device, that provides this entity, is in.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to add the entity to.
      required: true
      selector:
        area:
    entity_id:
      name: Entity ID
      description: The ID of the entity (or entities) to add to the area.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_remove_entity_from_area:
  name: Remove an entity from an area 👻
  description: >-
    Removes an entity from an area. As an entity can only be in one area, this
    call doesn't need to specify the area. Please note, the entity will
    still be in the area of the device that provides it after this call.
  fields:
    entity_id:
      name: Entity ID
      description: The ID of the entity (or entities) to remove the area from.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_delete_area:
  name: Delete an area 👻
  description: >-
    Deletes an area on the fly.
  fields:
    area_id:
      name: Area ID
      description: The ID of the area to delete.
      required: true
      selector:
        area:

homeassistant_disable_config_entry:
  name: Disable an integration 👻
  description: >-
    Disables integration entries, by entry or every entry of an integration.
  fields:
    config_entry_id:
      name: Integration entry
      description: The integration entry to disable.
      required: false
      selector:
        config_entry:
    domain:
      name: Integration
      description: >-
        Disable every entry of these integrations, the ones added later
        included.
      required: false
      example: hue
      selector:
        text:
          multiple: true

homeassistant_enable_config_entry:
  name: Enable an integration 👻
  description: >-
    Enables integration entries, by entry or every entry of an integration.
  fields:
    config_entry_id:
      name: Integration entry
      description: The integration entry to enable.
      required: false
      selector:
        config_entry:
    domain:
      name: Integration
      description: >-
        Enable every entry of these integrations, the ones added later
        included.
      required: false
      example: hue
      selector:
        text:
          multiple: true

homeassistant_disable_device:
  name: Disable a device 👻
  description: >-
    Disables a device on the fly.
  fields:
    device_id:
      name: Device
      description: The device(s) to disable.
      required: true
      selector:
        device:
          multiple: true

homeassistant_enable_device:
  name: Enable a device 👻
  description: >-
    Enables a device on the fly.
  fields:
    device_id:
      name: Device ID
      description: >-
        The raw device ID to enable. Disabled devices are not shown by Home
        Assistant's device selector. Multiple IDs can be provided as a YAML list.
      required: true
      selector:
        text:

homeassistant_disable_user:
  name: Disable a user 👻
  description: >-
    Disables a user account, preventing them from logging in.
  fields:
    user_id:
      name: User ID
      description: The ID(s) of the user(s) to disable.
      required: true
      selector:
        text:

homeassistant_enable_user:
  name: Enable a user 👻
  description: >-
    Enables a user account, allowing them to log in.
  fields:
    user_id:
      name: User ID
      description: The ID(s) of the user(s) to enable.
      required: true
      selector:
        text:

homeassistant_update_entity_id:
  name: Update an entity's ID 👻
  description: >-
    Updates an entity's ID on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to update.
      required: true
      selector:
        entity:
    new_entity_id:
      name: New Entity ID
      description: The new ID for the entity.
      required: true
      selector:
        text:

homeassistant_disable_entity:
  name: Disable an entity 👻
  description: >-
    Disables an entity (or entities) on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to disable.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_enable_entity:
  name: Enable an entity 👻
  description: >-
    Enables an entity (or entities) on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to enable.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_expose_entity:
  name: Expose an entity to assistants 👻
  description: >-
    Exposes an entity (or entities) to voice assistants.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to expose.
      required: true
      selector:
        entity:
          multiple: true
    assistants:
      name: Assistants
      description: The assistant(s) to apply this to.
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Alexa
              value: cloud.alexa
            - label: Google Assistant
              value: cloud.google_assistant
            - label: Assist
              value: conversation

homeassistant_hide_entity:
  name: Hide an entity 👻
  description: >-
    Hides an entity (or entities) on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to hide.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_rename_entity:
  name: Rename an entity 👻
  description: >-
    Renames an entity (or entities) on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to rename.
      required: true
      selector:
        entity:
          multiple: true
    name:
      name: Name
      description: The new name for the entity/entities.
      required: true
      selector:
        text:

homeassistant_set_entity_icon:
  name: Set the icon of an entity 👻
  description: >-
    Sets the icon of an entity (or entities) on the fly. Set it to null to go
    back to the icon the integration gives it.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to set the icon of.
      required: true
      selector:
        entity:
          multiple: true
    icon:
      name: Icon
      description: The new icon, or null for the integration's own icon.
      required: true
      selector:
        icon:

homeassistant_add_alias_to_entity:
  name: Add an alias to an entity 👻
  description: >-
    Adds one or more aliases to an entity (or entities), which voice
    assistants can call it by.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to add the alias(es) to.
      required: true
      selector:
        entity:
          multiple: true
    alias:
      name: Alias
      description: The alias(es) to add.
      required: true
      selector:
        text:
          multiple: true

homeassistant_remove_alias_from_entity:
  name: Remove an alias from an entity 👻
  description: >-
    Removes one or more aliases from an entity (or entities).
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to remove the alias(es) from.
      required: true
      selector:
        entity:
          multiple: true
    alias:
      name: Alias
      description: The alias(es) to remove.
      required: true
      selector:
        text:
          multiple: true

homeassistant_set_entity_aliases:
  name: Set aliases for an entity 👻
  description: >-
    Replaces the aliases of an entity (or entities). Whether the entity's own
    name counts as an alias stays as it was.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to set the aliases of.
      required: true
      selector:
        entity:
          multiple: true
    aliases:
      name: Aliases
      description: The aliases to set.
      required: true
      selector:
        text:
          multiple: true

homeassistant_unexpose_entity:
  name: Stop exposing an entity to assistants 👻
  description: >-
    Stops exposing an entity (or entities) to voice assistants.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to stop exposing.
      required: true
      selector:
        entity:
          multiple: true
    assistants:
      name: Assistants
      description: The assistant(s) to apply this to.
      required: true
      selector:
        select:
          multiple: true
          options:
            - label: Alexa
              value: cloud.alexa
            - label: Google Assistant
              value: cloud.google_assistant
            - label: Assist
              value: conversation

homeassistant_unhide_entity:
  name: Unhide an entity 👻
  description: >-
    Unhides an entity (or entities) on the fly.
  fields:
    entity_id:
      name: Entity
      description: The entity/entities to unhide.
      required: true
      selector:
        entity:
          multiple: true

homeassistant_create_floor:
  name: Create a floor 👻
  description: >-
    Creates a new floor on the fly.
  fields:
    name:
      name: Name
      description: The name of the floor to create.
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: Icon to use for the floor.
      required: false
      selector:
        icon:
          placeholder: mdi:texture-box
    level:
      name: Level
      description: The level the floor is on in your home.
      required: false
      selector:
        number:
    aliases:
      name: Aliases
      description: >-
        A list of aliases for the floor. This is useful if you want to use the
        floor in a different language or different nickname.
      selector:
        object:

homeassistant_add_alias_to_floor:
  name: Add an alias to a floor 👻
  description: >-
    Adds an alias to a floor.
  fields:
    floor_id:
      name: Floor ID
      description: The ID of the floor to add the alias to.
      required: true
      selector:
        floor:
    alias:
      name: Alias
      description: The alias (or list of aliases) to add to the floor.
      required: true
      selector:
        object:

homeassistant_remove_alias_from_floor:
  name: Remove an alias from a floor 👻
  description: >-
    Removes an alias from a floor.
  fields:
    floor_id:
      name: Floor ID
      description: The ID of the floor to remove the alias from.
      required: true
      selector:
        floor:
    alias:
      name: Alias
      description: The alias (or list of aliases) to remove from the floor.
      required: true
      selector:
        object:

homeassistant_set_floor_aliases:
  name: Sets aliases for a floor 👻
  description: >-
    Sets aliases for a floor. Overwrites and removes any existing aliases,
    fully replacing them with the new ones.
  fields:
    floor_id:
      name: Floor ID
      description: The ID of the floor to set the aliases for.
      required: true
      selector:
        floor:
    aliases:
      name: Aliases
      description: The aliases to set for the floor.
      required: true
      selector:
        object:

homeassistant_add_area_to_floor:
  name: Add an area to a floor 👻
  description: >-
    Adds an area to a floor. Please note, if the area is already on a floor,
    it will be removed from the previous floor.
  fields:
    floor_id:
      name: Floor ID
      description: The ID of the floor to add the area on.
      required: true
      selector:
        floor:
    area_id:
      name: Area ID
      description: The ID of the area(s) to add to the floor.
      required: true
      selector:
        area:
          multiple: true

homeassistant_remove_area_from_floor:
  name: Remove an area from a floor 👻
  description: >-
    Removes an area from a floor. As an area can only be on one floor, this
