          filter:
            - domain: input_text

input_button_create:
  name: Create an input button 👻
  description: >-
    Creates a new input button helper on the fly. Returns the entity ID of the
    new input button.
  fields:
    name:
      name: Name
      description: The name of the new input button.
      required: true
      selector:
        text:
    input_button_id:
      name: Input button entity ID
      description: >-
        The entity ID for the new input button. The input_button. prefix is
        added automatically. If not provided, the entity ID will be generated
        based on the name.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: The icon for the new input button.
      required: false
      selector:
        icon:
          placeholder: mdi:gesture-tap-button

input_button_delete:
  name: Delete an input button 👻
  description: >-
    Deletes input button helpers made in the UI or with the create an input
    button action. Input buttons set up in YAML cannot be deleted by Spook.
  fields:
    entity_id:
      name: Entity ID
      description: The input button(s) to delete.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_button

input_datetime_create:
  name: Create an input datetime 👻
  description: >-
    Creates a new input datetime helper on the fly, holding a date, a time, or
    both. Returns the entity ID of the new input datetime.
  fields:
    name:
      name: Name
      description: The name of the new input datetime.
      required: true
      selector:
        text:
    input_datetime_id:
      name: Input datetime entity ID
      description: >-
        The entity ID for the new input datetime. The input_datetime. prefix is
        added automatically. If not provided, the entity ID will be generated
        based on the name.
      required: false
      selector:
        text:
    has_date:
      name: Has a date
      description: >-
        Whether it holds a date. At least one of date and time has to be on.
      required: false
      selector:
        boolean:
    has_time:
      name: Has a time
      description: >-
        Whether it holds a time. At least one of date and time has to be on.
      required: false
      selector:
        boolean:
    initial:
      name: Initial value
      description: >-
        The date and/or time it starts with, like 2026-12-31, 08:30:00, or
        2026-12-31 08:30:00. If left out, it keeps the value it had before
        Home Assistant restarted.
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: The icon for the new input datetime.
      required: false
      selector:
        icon:
          placeholder: mdi:calendar-clock

input_datetime_delete:
  name: Delete an input datetime 👻
  description: >-
    Deletes input datetime helpers made in the UI or with the create an input
    datetime action. Input datetimes set up in YAML cannot be deleted by Spook.
  fields:
    entity_id:
      name: Entity ID
      description: The input datetime(s) to delete.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_datetime

input_number_create:
  name: Create an input number 👻
  description: >-
    Create a new input number helper on the fly. Returns the entity ID of the
    new input number.
  fields:
    name:
      name: Name
      description: The name of the new input number helper.
      required: true
      selector:
        text:
    input_number_id:
      name: Input number entity ID
      description: >-
        The entity ID for the new input number helper. The input_number. prefix
        is added automatically. If not provided, the entity ID will be generated
        based on the name.
      required: false
      selector:
        text:
    min:
      name: Minimum
      description: The minimum value of the input number.
      required: false
      default: 0
      selector:
        number:
          mode: box
          step: any
    max:
      name: Maximum
      description: The maximum value of the input number.
      required: false
      default: 100
      selector:
        number:
          mode: box
          step: any
    initial:
      name: Initial value
      description: The initial value of the input number when Home Assistant starts.
      required: false
      selector:
        number:
          mode: box
          step: any
    step:
      name: Step size
      description: The step size of the input number.
      required: false
      default: 1
      selector:
        number:
          mode: box
          step: any
    mode:
      name: Display mode
      description: >-
        The display mode of the input number, which can be either a slider or
        an input box.
      required: false
      default: slider
      selector:
        select:
          options:
            - label: Slider
              value: slider
            - label: Input field
              value: box
    icon:
      name: Icon
      description: The icon to use for the input number helper.
      required: false
      selector:
        icon:
    unit_of_measurement:
      name: Unit of measurement
      description: The unit of measurement of the input number.
      required: false
      selector:
        text:

input_number_delete:
  name: Delete an input number 👻
  description: >-
    Deletes input number helpers made in the UI or with the create an input
    number action. Input numbers set up in YAML cannot be deleted by Spook.
  fields:
    entity_id:
      name: Entity ID
      description: The input number(s) to delete.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_number

person_add_device_tracker:
  name: Add a device tracker 👻
  description: >-
    Add a device tracker to a person.
  fields:
    entity_id:
      name: Person
      description: >-
        The person entity ID to add the device tracker to.
      required: true
      selector:
        entity:
          filter:
            - domain: person
    device_tracker:
      name: Device tracker
      description: >-
        The device tracker entity ID to add to the person.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: device_tracker

person_remove_device_tracker:
  name: Remove a device tracker 👻
  description: >-
    Remove a device tracker from a person.
  fields:
    entity_id:
      name: Person
      description: >-
        The person entity ID to remove the device tracker from.
      required: true
      selector:
        entity:
          filter:
            - domain: person
    device_tracker:
      name: Device tracker
      description: >-
        The device tracker entity ID to remove from the person.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: device_tracker

repairs_create:
  name: Create issue 👻
  description: >-
    Manually create and raise an issue in Home Assistant repairs.
  fields:
    title:
      name: Title
      description: The title of the issue.
      required: true
      selector:
        text:
    description:
      name: Description
      description: The description of the issue. Supports Markdown.
      required: true
      selector:
        text:
          multiline: true
    issue_id:
      name: Issue ID
      description: >-
        The issue can have an identifier, which allows you to cancel it
        later with that ID if needed. It also prevents duplicate issues
        to be created. If not provided, a random ID will be generated.
      required: false
      selector:
        text:
    domain:
      name: Domain
      description: >-
        This field can be used to set the domain of the issue. For example,
        by default (if not set), it will use "spook". This causes Spook to
        be shown in the logo/image of the issue. If you set it to
        "homeassistant", the Home Assistant logo will be used, or use "hue",
        "zwave_js", "mqtt", etc. to use the logo of that integration.
      required: false
      selector:
        text:
    severity:
      name: Severity
      description: >-
        The severity of the issue. This will be used to determine the
        priority of the issue. If not set, "warning" will be used.
      required: false
      selector:
        select:
          options:
            - label: Warning
              value: warning
            - label: Error
              value: error
            - label: Critical
              value: critical
    persistent:
      name: Persistent
      description: >-
        If the issue should be persistent, which means it will survive
        restarts of Home Assistant. By default, issues are not persistent.
      required: false
      selector:
        boolean:

repairs_ignore_all:
  name: Ignore all issues 👻
  description: >-
    Ignore all issues currently raised in Home Assistant Repairs, or only
    those raised by particular integrations.
  fields:
    domain:
      name: Domain
      description: Only ignore the issues raised by these integrations.
      required: false
      example: hacs
      selector:
        text:
          multiple: true

repairs_list:
  name: List issues 👻
  description: >-
    Lists the issues currently raised in Home Assistant Repairs, with their
    titles, for an automation to act on or a dashboard to show.
  fields:
    include_ignored:
      name: Include ignored
      description: Also list the issues that have been ignored.
      required: false
      default: false
      selector:
        boolean:
    domain:
      name: Domain
      description: Only list the issues raised by these integrations.
      required: false
      example: hue
      selector:
        text:
          multiple: true
    severity:
      name: Severity
      description: Only list the issues with these severities.
      required: false
      selector:
        select:
          multiple: true
          translation_key: repair_issue_severity
          options:
            - critical
            - error
            - warning

repairs_remove:
  name: Remove issue 👻
  description: >-
    Removes a manually created Home Assistant repairs issue. This action
    can only remove issues created with the `repairs_create` action.
  fields:
    issue_id:
      name: Issue ID
      description: >-
        The issue ID to remove.
      required: true
      selector:
        text:

repairs_unignore_all:
  name: Unignore all issues 👻
  description: >-
    Unignore all issues currently raised in Home Assistant Repairs, or only
    those raised by particular integrations.
  fields:
    domain:
      name: Domain
      description: Only unignore the issues raised by these integrations.
      required: false
      example: hacs
      selector:
        text:
          multiple: true

sensor_set_display_precision:
  name: Set display precision 👻
  description: >-
    Sets the number of decimals shown for one or more sensors.
  fields:
    entity_id:
      name: Entity
      description: The sensor entity/entities to update.
      required: true
      selector:
        entity:
          multiple: true
          domain: sensor
    display_precision:
      name: Display precision
      description: The number of decimals to show for the sensor.
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: box

timer_create:
  name: Create a timer 👻
  description: >-
    Creates a new timer helper on the fly. Returns the entity ID of the new
    timer.
  fields:
    name:
      name: Name
      description: The name of the new timer.
      required: true
      selector:
        text:
    timer_id:
      name: Timer entity ID
      description: >-
        The entity ID for the new timer. The timer. prefix is added
        automatically. If not provided, the entity ID will be generated based on
        the name.
      required: false
      selector:
        text:
    duration:
      name: Duration
      description: How long the timer runs when it is started.
      required: false
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
    restore:
      name: Restore
      description: >-
        Restore the state of the timer when Home Assistant starts, so a running
        timer keeps running across a restart.
      required: false
      default: false
      selector:
        boolean:
    icon:
      name: Icon
      description: The icon for the new timer.
      required: false
      selector:
        icon:
          placeholder: mdi:timer-outline

timer_delete:
  name: Delete a timer 👻
  description: >-
    Deletes timer helpers made in the UI or with the create a timer action.
    Timers set up in YAML cannot be deleted by Spook.
  fields:
    entity_id:
      name: Entity ID
      description: The timer(s) to delete.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: timer

timer_set_duration:
  name: Set duration 👻
  description: >-
    Set duration for an existing timer.
  target:
    entity:
      domain: timer
  fields:
    duration:
      name: Duration
      description: New duration for the timer, as a timedelta string.
      required: true
      example: "00:01:00, 60"
      selector:
        text:

zone_create:
  name: Create a zone 👻
  description: >-
    Create a new zone in Home Assistant on the fly.
  fields:
    name:
      name: Name
      description: Name of the zone
      required: true
      selector:
        text:
    icon:
      name: Icon
      description: Icon to use for the zone
      required: false
      selector:
        icon:
          placeholder: mdi:map-marker
    latitude:
      name: Latitude
      description: Latitude of the zone. This can be a template.
      required: true
      selector:
        template:
    longitude:
      name: Longitude
      description: Longitude of the zone. This can be a template.
      required: true
      selector:
        template:
    radius:
      name: Radius
      description: Radius of the zone
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 999999999999
          unit_of_measurement: m
          mode: box
    passive:
      name: Passive
      description: >-
        A passive zone is only there for automations: it is not shown on the
        map, and does not change where people and device trackers are.
      required: false
      default: false
      selector:
        boolean:

zone_update:
  name: Update a zone 👻
  description: >-
    Update properties of a zone on the fly.
  fields:
    entity_id:
      name: Entity ID
      description: The ID of the entity (or entities) to update.
      required: true
      selector:
        entity:
          filter:
            - domain: zone
    name:
      name: Name
      description: Name of the zone
      required: false
      selector:
        text:
    icon:
      name: Icon
      description: Icon to use for the zone
      required: false
      selector:
        icon:
          placeholder: mdi:map-marker
    latitude:
      name: Latitude
      description: Latitude of the zone. This can be a template.
      required: false
      selector:
        template:
    longitude:
      name: Longitude
      description: Longitude of the zone. This can be a template.
      required: false
      selector:
        template:
    radius:
      name: Radius
      description: Radius of the zone
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 999999999999
          step: any
          unit_of_measurement: m
          mode: box
    passive:
      name: Passive
      description: >-
        A passive zone is only there for automations: it is not shown on the
        map, and does not change where people and device trackers are.
      required: false
      selector:
        boolean:

zone_delete:
  name: Delete a zone 👻
  description: >-
    Delete a zone. This works only with zones created and managed via the UI.
    Zones created and managed in YAML cannot be managed by Spook.
  fields:
    entity_id:
      name: Entity ID
      description: The ID of the entity (or entities) to remove.
      required: true
      selector:
        entity:
          multiple: true
          filter:
            - domain: zone

wait_for_condition:
  name: Wait for a condition 👻
  description: >-
    Wait until a condition is true. Returns straight away if it already is.
  fields:
    condition:
      name: Condition
      description: The condition to wait for.
      required: true
      selector:
        condition:
    timeout:
      name: Timeout
      description: >-
        How long to wait before giving up. Waits indefinitely when left out.
      required: false
      example: "00:05:00"
      selector:
        duration:

group_add_members:
  name: Add members to a group 👻
  description: >-
    Adds entities to a group made through the interface, while Home Assistant
    is running. Entities already in the group are left where they are.
  fields:
    group:
      name: Group
      description: The group to add to.
      required: true
      example: light.hallway
      selector:
        entity:
          integration: group
    members:
      name: Members
      description: The entities to add to the group.
      required: true
      selector:
        entity:
          multiple: true

group_remove_members:
  name: Remove members from a group 👻
  description: >-
    Takes entities out of a group made through the interface, while Home
    Assistant is running. Naming something that is not in the group does
    nothing, so this is also how you clear out a member that no longer exists.
  fields:
    group:
      name: Group
      description: The group to take them out of.
      required: true
      example: light.hallway
      selector:
        entity:
          integration: group
    members:
      name: Members
      description: The entities to remove from the group.
      required: true
      selector:
        entity:
          multiple: true

group_set_members:
  name: Set the members of a group 👻
  description: >-
    Replaces the members of a group made through the interface with the ones
    given, while Home Assistant is running.
  fields:
    group:
      name: Group
      description: The group to change.
      required: true
      example: light.hallway
      selector:
        entity:
          integration: group
    members:
      name: Members
      description: The entities the group should hold from now on.
      required: true
      selector:
        entity:
          multiple: true

water_heater_increase_temperature:
  name: Increase temperature 👻
  description: >-
    Turns a water heater's setpoint up a step.
  target:
    entity:
      domain: water_heater
      supported_features:
        - water_heater.WaterHeaterEntityFeature.TARGET_TEMPERATURE
  fields:
    step:
      required: false
      example: 1
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box

water_heater_decrease_temperature:
  name: Decrease temperature 👻
  description: >-
    Turns a water heater's setpoint down a step.
  target:
    entity:
      domain: water_heater
      supported_features:
        - water_heater.WaterHeaterEntityFeature.TARGET_TEMPERATURE
  fields:
    step:
      required: false
      example: 1
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          mode: box

humidifier_increase_humidity:
  name: Increase humidity 👻
  description: >-
    Turns a humidifier's target humidity up a step.
  target:
    entity:
      domain: humidifier
  fields:
    step:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

humidifier_decrease_humidity:
  name: Decrease humidity 👻
  description: >-
    Turns a humidifier's target humidity down a step.
  target:
    entity:
      domain: humidifier
  fields:
    step:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

cover_increase_position:
  name: Increase position 👻
  description: >-
    Moves a cover a step further open.
  target:
    entity:
      domain: cover
      supported_features:
        - cover.CoverEntityFeature.SET_POSITION
  fields:
    step:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

cover_decrease_position:
  name: Decrease position 👻
  description: >-
    Moves a cover a step further closed.
  target:
    entity:
      domain: cover
      supported_features:
        - cover.CoverEntityFeature.SET_POSITION
  fields:
    step:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

valve_increase_position:
  name: Increase position 👻
  description: >-
    Moves a valve a step further open.
  target:
    entity:
      domain: valve
      supported_features:
        - valve.ValveEntityFeature.SET_POSITION
  fields:
    step:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

valve_decrease_position:
  name: Decrease position 👻
  description: >-
    Moves a valve a step further closed.
  target:
    entity:
      domain: valve
      supported_features:
        - valve.ValveEntityFeature.SET_POSITION
  fields:
    step:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

media_player_increase_volume:
  name: Increase volume 👻
  description: >-
    Turns a media player's volume up by the step you give.
  target:
    entity:
      domain: media_player
      supported_features:
        - media_player.MediaPlayerEntityFeature.VOLUME_SET
  fields:
    step:
      required: true
      example: 5
      selector:
        number:
          min: 0.5
          max: 100
          step: 0.5
          unit_of_measurement: "%"
          mode: box

media_player_decrease_volume:
  name: Decrease volume 👻
  description: >-
    Turns a media player's volume down by the step you give.
  target:
    entity:
      domain: media_player
      supported_features:
        - media_player.MediaPlayerEntityFeature.VOLUME_SET
  fields:
    step:
      required: true
      example: 5
      selector:
        number:
          min: 0.5
          max: 100
          step: 0.5
          unit_of_measurement: "%"
          mode: box

todo_move_item:
  name: Move item 👻
  description: >-
    Moves an item in a to-do list to the top, the bottom, or after another
    item.
  target:
    entity:
      domain: todo
      supported_features:
        - todo.TodoListEntityFeature.MOVE_TODO_ITEM
  fields:
    item:
      required: true
      example: Take out the bins
      selector:
        text:
    after:
      required: false
      example: Do the dishes
      selector:
        text:
    position:
      required: false
      selector:
        select:
          translation_key: todo_move_position
          options:
            - top
            - bottom
