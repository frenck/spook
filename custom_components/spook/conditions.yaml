triggered_by_user:
  fields:
    person:
      required: false
      example: person.frenck
      selector:
        entity:
          domain: person
          multiple: true
not_triggered_by_user: {}
chance:
  fields:
    percentage:
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
cooldown:
  fields:
    duration:
      required: true
      example: "00:05:00"
      selector:
        duration:
triggered_by_automation:
  fields:
    automation:
      required: false
      example: automation.goodnight
      selector:
        entity:
          domain: automation
          multiple: true
