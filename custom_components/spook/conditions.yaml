_automation.triggered_by_user:
  fields:
    user_id:
      required: false
      example: 0f1c2b3a4d5e6f708192a3b4c5d6e7f8
      selector:
        text:
          multiple: true
_automation.not_triggered_by_user: {}
chance:
  fields:
    percentage:
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
cooldown:
  fields:
    duration:
      required: true
      example: "00:05:00"
      selector:
        duration:
