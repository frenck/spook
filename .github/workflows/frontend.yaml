---
name: Frontend

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
      - ".github/workflows/release.yaml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: "frontend/.nvmrc"

      - name: 🏗 Install dependencies
        run: npm ci --ignore-scripts

      - name: 🎨 Lint
        run: npm run lint

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🧪 Test
        run: npm run test

      - name: 🚀 Build
        run: npm run build

      - name: ⚖️ Check the size of the dashboard bundle
        run: npm run size

      # The release workflow cannot be tried without a release. So from here
      # on this does what it does, step for step: build what a release ships,
      # hand it to a second job, and zip the integration there.
      - name: 🚀 Build what a release ships
        run: |
          rm -rf ../custom_components/spook/static
          npm run build:release

      - name: ⬆️ Hand the built frontends to the next job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontends
          path: custom_components/spook/static/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package like a release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: ⤵️ Fetch the built frontends
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontends
          path: custom_components/spook/static/

      # What Home Assistant is going to be told to load has to be in the zip,
      # at the path Spook serves it from.
      - name: 📦 Check the zip has the dashboard bundle
        working-directory: ./custom_components/spook
        run: |
          zip --quiet spook.zip -r ./
          unzip -Z1 spook.zip | grep --line-regexp "static/dashboard/spook.js"
