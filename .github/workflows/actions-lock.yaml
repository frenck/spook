---
name: Actions Lock

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_ACTIONS_LOCK_VERSION: v0.5.1
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The lockfile would freeze a branch at one commit, and Renovate leaves
      # a locked branch alone. So a branch is pinned as `@<sha> # <branch>`.
      - name: 🔍 Check that branch refs are pinned to a commit
        run: |
          if grep -rnE 'uses:\s*[^ #]+@(main|master|dev)\b' .github/workflows; then
            echo "::error::Pin branch refs as @<sha> # <branch>, actions.lock would freeze them"
            exit 1
          fi

      - name: 🏗 Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"

      - name: 🚀 Verify the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
