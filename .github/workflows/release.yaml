---
name: Release

on:
  release:
    types:
      - published

jobs:
  # A job of its own, with nothing but read access. Building runs the code of
  # every build tool and its dependencies. The job that signs and uploads the
  # release never does, so none of that code gets near the signing identity
  # or a token that can write to the repository.
  frontends:
    name: Build the frontends
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: "frontend/.nvmrc"
          # A cache is something another workflow could have filled. What
          # goes into a release is installed fresh.
          package-manager-cache: false

      - name: 🚀 Build the frontends
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm run build:release

      - name: ⬆️ Hand the built frontends to the release
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontends
          path: custom_components/spook/static/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release the Spook! 👻
    runs-on: ubuntu-latest
    needs: frontends
    permissions:
      contents: write
      id-token: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🔢 Adjust version number
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG}"
          version="${version,,}"
          version="${version#v}"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/spook/manifest.json"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/spook/integrations/spook_inverse/manifest.json"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/spook/integrations/spook_time_in_state/manifest.json"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/spook/integrations/spook_calibration/manifest.json"

      # Into custom_components/spook/static, so the zip below has them.
      - name: ⤵️ Fetch the built frontends
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontends
          path: custom_components/spook/static/

      - name: 📦 Created zipped release package
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/spook"
          zip spook.zip -r ./

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ${{ github.workspace }}/custom_components/spook/spook.zip

      - name: ⬆️ Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          "${{ github.workspace }}/custom_components/spook/spook.zip"
          --clobber

        # Upload this one in the future, currently problematic for HACS
        # https://github.com/frenck/spook/issues/286
        # ${{ github.workspace }}/custom_components/spook/spook.zip.sigstore
