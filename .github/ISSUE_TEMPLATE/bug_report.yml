name: Report an issue with Spook
description: Spook did something it should not, or did not do something it should.
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for taking the time to report this! 👻**

        This tracker is for things that are broken. Got an idea, a question, or need a hand? The [discussions](https://github.com/frenck/spook/discussions) are the place for that.

  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing issues](https://github.com/frenck/spook/issues?q=is%3Aissue), open and closed, and this one is new. If it is not, a 👍 on the existing one helps more than a duplicate.
          required: true

  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: What happened?
      description: >-
        Tell us what you were doing, step by step, and what happened that you did not expect. Screenshots help, you can paste them right here. 📸

  - type: dropdown
    id: area
    validations:
      required: true
    attributes:
      label: Which part of Spook is it about?
      options:
        - A repair (something Spook reported, or should have)
        - An action
        - A trigger or condition
        - A helper (like inverse, calibration, or time in state)
        - An entity Spook adds
        - Setting Spook up, or updating it
        - Something else

  - type: input
    id: name
    attributes:
      label: Which one exactly?
      description: >-
        The name of the repair, action, trigger, condition or helper, if it is about a specific one.
      placeholder: 'like "Unknown entities used in: Morning lights" or homeassistant.disable_polling'

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: Spook version
      description: >-
        Shown on the Spook page under [**Settings** > **Devices & services**](https://my.home-assistant.io/redirect/integration/?domain=spook).

  - type: input
    id: last_working
    attributes:
      label: Last version that worked
      description: >-
        Did this work before? Then the last version you know was fine helps a lot in tracking it down.

  - type: input
    id: homeassistant
    validations:
      required: true
    attributes:
      label: Home Assistant version
      description: >-
        Can be found in [**Settings** > **About**](https://my.home-assistant.io/redirect/info/).

  - type: dropdown
    id: installed_with
    validations:
      required: true
    attributes:
      label: How did you install Spook?
      options:
        - Home Assistant Marketplace
        - HACS
        - Manually

  - type: textarea
    id: yaml
    attributes:
      label: An example, in YAML
      description: >-
        If it is about an action, trigger, condition or a repair on something you made, share the YAML of the automation, script or action call. Strip out anything private.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs?
      description: >-
        Check your [Home Assistant logs](https://my.home-assistant.io/redirect/logs/) for anything related, and paste it here. Want more detail? Turn on debug logging for Spook on its page under **Settings** > **Devices & services**, try again, and paste what that shows.
      render: plain text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Whatever else you think helps us find this ghost.

  - type: markdown
    attributes:
      value: |
        Thanks! 🙌

        ../Frenck
