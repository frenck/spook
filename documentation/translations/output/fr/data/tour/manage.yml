  title: Tapez 👻. Voyez tout.
  description: Spook ajoute {actions} actions, trois entrées et un capteur pour tout ce qu'il y a chez vous. Pas de liste à retenir. Cherchez le fantôme quand vous ajoutez une action ou une entrée, et vous obtenez exactement ce que Spook apporte. Ça marche aussi dans toutes les langues.
  screenshot: actions-ghost-search
