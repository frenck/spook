sections:
  - headline: Votre maison, en chiffres
    title: Combien d'automatisations, déjà ?
    description: Spook donne un appareil à Home Assistant lui-même, avec un capteur pour tout ce qu'il y a chez vous. Pièces, automatisations, appareils, entités, intégrations, 53 en tout. Mettez-les sur un tableau de bord, utilisez-les dans une automatisation, ou regardez simplement les chiffres grimper.
    screenshot: home-assistant-numbers
    alt: Les capteurs de diagnostic de l'appareil Home Assistant de Spook, qui comptent les pièces, les automatisations, les boutons et le reste.
