  - headline: Des entrées que Home Assistant n'a pas
    title: Inversé, corrigé et chronométré.
    description: Un interrupteur qui marche à l'envers, un capteur qui affiche un degré de trop, une porte dont vous voulez savoir qu'elle est restée fermée toute la semaine. Les entrées de Spook règlent ça, créées dans l'interface comme n'importe quelle autre entrée.
    screenshot: helpers-ghost-search
    alt: La boîte de dialogue Créer une entrée de Home Assistant, avec une recherche sur l'emoji fantôme, qui montre les entrées Étalonnage, Inverser et Temps dans l'état de Spook.
