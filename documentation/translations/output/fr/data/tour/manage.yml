      - title: Inverser
        description: Allumé devient éteint, ouvert devient fermé, et les actions sont inversées aussi. Pour les volets dont le moteur est de l'autre côté.
        icon: i-mdi-swap-horizontal
      - title: Étalonnage
        description: Corrige un capteur qui affiche une valeur fausse, avec un facteur et un décalage.
        icon: i-mdi-tune-variant
      - title: Temps dans l'état
        description: Depuis quand la porte est fermée. Contrairement à « dernière modification », un redémarrage ne le remet pas à zéro.
