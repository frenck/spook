  - headline: Ayudantes que Home Assistant no tiene
    title: Invertido, corregido y cronometrado.
    description: Un interruptor que funciona al revés, un sensor que marca un grado de más, una puerta de la que quieres saber que lleva cerrada toda la semana. Los ayudantes de Spook lo arreglan, y se crean en la interfaz como cualquier otro ayudante.
    screenshot: helpers-ghost-search
    alt: El cuadro de diálogo Crear ayudante de Home Assistant, con la búsqueda del emoji del fantasma, que muestra los ayudantes Calibración, Invertir y Tiempo en estado de Spook.
    features:
      - title: Invertir
        description: Encendido pasa a apagado, abierto pasa a cerrado, y las acciones también se invierten. Para las persianas con el motor del otro lado.
        icon: i-mdi-swap-horizontal
      - title: Calibración
        description: Corrige un sensor que mide mal, con un factor y un desplazamiento.
        icon: i-mdi-tune-variant
