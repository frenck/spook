sections:
  - headline: Tu casa, contada
    title: ¿Cuántas automatizaciones eran?
    description: Spook le da al propio Home Assistant un dispositivo, con un sensor para todo lo que hay en tu casa. Áreas, automatizaciones, dispositivos, entidades, integraciones, los 53. Ponlos en un panel de control, úsalos en una automatización, o simplemente mira cómo crecen los números.
    screenshot: home-assistant-numbers
    alt: Los sensores de diagnóstico del dispositivo Home Assistant de Spook, que cuentan áreas, automatizaciones, botones y más.
