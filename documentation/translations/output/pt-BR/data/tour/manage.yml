  headline: O resto da caixa de ferramentas 🧰
  title: Digite 👻. Veja tudo.
  description: O Spook adiciona {actions} ações, três helpers e um sensor para tudo na sua casa. Nenhuma lista para decorar. Pesquise pelo fantasma quando adicionar uma ação ou um helper, e você recebe exatamente o que o Spook traz. Funciona em qualquer idioma, também.
  screenshot: actions-ghost-search
