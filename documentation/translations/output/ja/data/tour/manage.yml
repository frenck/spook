    title: 反転して、補正して、時間を計る。
    description: 逆向きに動くスイッチ、1度高く出るセンサー、1週間ずっと閉まっていたかを知りたいドア。Spookのヘルパーがそれを解決します。ほかのヘルパーと同じくUIで作れます。
