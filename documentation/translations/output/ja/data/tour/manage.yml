    description: SpookはHome Assistant自体にデバイスを1つ作り、家の中のあらゆるものにセンサーを付けます。エリア、オートメーション、デバイス、エンティティ、統合など、全部で53個。ダッシュボードに置いたり、オートメーションで使ったり、数が増えるのをただ眺めたり。
