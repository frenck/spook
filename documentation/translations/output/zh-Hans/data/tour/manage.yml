  - headline: Home Assistant 没有的辅助元素
    title: 反转、校准、计时。
    description: 一个反着工作的开关，一个读数高了一度的传感器，一扇你想知道是不是一整周都关着的门。Spook 的辅助元素能解决这些，和其他辅助元素一样在界面里创建。
    screenshot: helpers-ghost-search
