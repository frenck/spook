        description: 本来就是这样？说一次，Spook 就不再指出来了。
        icon: i-mdi-bell-off-outline
      - title: 动手前再检查一遍
        description: 如果自 Spook 检查后有东西变了，它就不去动它。
        icon: i-mdi-shield-check-outline

