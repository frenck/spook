        description: 给灯改了名？当 Spook 几乎可以确定时，它会建议新名称。
        icon: i-mdi-lightbulb-question-outline
      - title: 自己消失
        description: 修好并保存。Spook 会再检查一遍，然后清除这条修复。不用你去勾选什么。
        icon: i-mdi-check-circle-outline

  - headline: 替你修好
    title: 点头同意，它就没了。
    description: 很多修复都附带修复方法。一个空区域、一个未使用的标签、一个还在追踪旧手机的人员。Spook 会主动提出清理，而且会先问你。
    screenshot: repair-fix-empty-area
    alt: Spook 针对空的“阁楼”区域的一条修复，提供三个选择：删除它、让你自己修，或者保留它并不再询问。
