hero:
  headline: 找出幽灵 👻
  title: 它会找出悄悄坏掉的东西。
  description: 给灯改个名、换个传感器、删掉一个集成，某个地方的自动化就一声不吭地停止工作了。Spook 会注意到，并在修复页面上告诉你。能发现 {repairs} 种问题，而且它一直在找。
  screenshot: repairs-list
  alt: Home Assistant 的修复页面，上面有 Spook 的七条修复，比如一个空区域、一个未使用的标签，以及一个使用了已不存在实体的自动化。

sections:
  - headline: 具体是什么，在哪里
    title: 不用在 YAML 里翻找。
    description: 每条修复都会写明出问题的地方，以及哪里不对。选择那个名称，你就进入了编辑器，正好停在需要修的地方。
    screenshot: repair-unknown-entities
    alt: Spook 的一条修复，写明了“电影之夜”自动化以及它用到的三个已不存在的实体，还附上了原本可能指的是什么。
    features:
      - title: 直指问题所在
        description: 自动化、脚本或仪表盘，附带直达它的链接。
        icon: i-mdi-target
