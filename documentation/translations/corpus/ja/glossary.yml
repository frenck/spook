# The Japanese glossary, by hand.
#
# Decided by Frenck: nothing yet. Decisions he makes go in this block, with
# the date, and win over everything below.
#
# `terms` are words in running text: what Home Assistant calls its own things
# in Japanese, so the docs use the words the reader sees in the product.
# English to Japanese. Short pairs only, no sentences: this file ends up in a
# prompt.
#
# `labels` overrides what glossary.generated.yml found for a bold label. Give
# a `reason`, and either the `key` of the string that is on that screen, or a
# `translation` when no string has it.
#
# Looked up in the strings of Home Assistant 2026.11.3 and Spook, 2026-11-25.
# Not yet read by a native speaker.
#
# Where the frontend and Spook's own strings disagree, this follows the
# frontend, because that is the screen the reader has open:
# - entity ID is "エンティティ ID", with the space, the way the frontend and
#   Spook write it. "エンティティID" shows up once.
# - integration is "統合", the frontend's word everywhere.
# No Home Assistant word:
# - notifier: Home Assistant has none. "通知先" is Spook's own word.
# - snooze: Spook's own action name, "スヌーズ".
