  # Chosen for consistency on 2026-11-25 by an agent, not by a native
  # speaker. Three translators wrote the first pages in parallel and already
  # agreed on every one of these; they are written down so the next run
  # keeps them. Headings, labels and table cells first, then type names.
  how to fix it: 直し方
  how to use it: 使い方
  how Spook checks this: Spookのチェック方法
  technical details: 技術的な詳細
  known limitations: 既知の制限
  use cases: 使用例
  example actions in YAML: YAMLでのアクションの例
  example triggers in YAML: YAMLでのトリガーの例
  example conditions in YAML: YAMLでの条件の例
  blueprints & tutorials: ブループリントとチュートリアル
  feature requests, ideas, and support: 機能のリクエスト、アイデア、サポート
  unknown referenced entities: 参照先が不明なエンティティ
