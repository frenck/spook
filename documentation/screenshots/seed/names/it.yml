# Everything people read in the home of the screenshots, in Italian. The keys
# and how it works: see en.yml. A name missing here is the English one.

home: La casa di Spook

area:
  # The names Home Assistant gives these when it is onboarded in Italian.
  living_room: Soggiorno
  kitchen: Cucina
  bedroom: Camera da letto
  hallway: Corridoio
  attic: Soffitta

floor:
  ground_floor: Piano terra
  first_floor: Primo piano
  basement: Seminterrato

label:
  night_light:
    name: Luce notturna
    description: Resta accesa di notte.
  christmas:
    name: Natale
    description: Le luci che escono a dicembre.

# No `overview`: Home Assistant's Italian onboarding has no name for the
# default dashboard, so it stays "Overview".
dashboard:
  title: Casa
  upstairs: Di sopra

light:
  living_room_lamp: Lampada del soggiorno
  kitchen_lights: Luci della cucina
  hallway_light: Luce del corridoio
  bedroom_lamp: Lampada della camera

