    description: 出现严重的修复项，或者有修复项解决时通知我。
    message: 修复里有变化。
  bedroom_warm:
    name: 卧室暖和了
    description: 卧室温控器达到设定温度时通知我。
    message: 卧室暖和了。
  hot_water_ready:
    name: 早上洗澡的热水
    description: 七点时告诉我热水器是否已经热了。
    message: 热水准备好了。
  update_installed:
    name: 已安装更新
    description: 安装更新后通知我。
    message: 安装了一个更新。
  ghost_goes_to_sleep:
    name: 幽灵去睡觉
    description: 晚安脚本开始时让幽灵去睡觉。
  door_opens_hallway_light:
    name: 开门时开走廊灯
    description: 任何一扇门打开时打开走廊灯。
  new_user:
    name: 新用户
    description: Home Assistant 添加用户时通知我。
    message: 添加了一个新用户。
  welcome_home:
    name: 欢迎回家
    description: 手机到家且前门打开，五分钟内两件事都发生时打开客厅台灯。
  door_settled:
    name: 门安静后关走廊灯
    description: 前门安静 30 秒后关闭走廊灯。
  coming_in:
    name: 进门
    description: 前门打开后两分钟内又关上时打开客厅台灯。
  front_door_still_open:
    name: 前门还开着
    description: 前门开着期间每十分钟提醒我一次。
    message: 前门还开着。
  nobody_up_yet:
    name: 还没人起床
    description: 七点后厨房灯一小时都没开时通知我。
    message: 还没有人起床。
  front_door_sensor_acting_up:
    name: 前门传感器不正常
    description: 前门传感器五分钟内变化五次时通知我。
    message: 前门传感器一直不稳定。
  blinds_down_when_warm:
    name: 热了就放下百叶窗
    description: 客厅温度超过 25 °C 时关上客厅百叶窗。
  lamp_off_by_itself:
    name: 台灯自己关了
    description: 客厅台灯关闭且不是有人关的时通知我。
    message: 客厅台灯自己关了。
  spooky_surprise:
    name: 吓人的惊喜
    description: 有些晚上，五次里有一次，幽灵会变得吓人。
  follow_the_hallway:
    name: 跟着走廊
    description: 日落自动化打开走廊灯时，也打开客厅台灯。
  morning_repairs_check:
    name: 早上检查修复
    description: 九点时告诉我修复里是否有严重的问题在等着。
    message: 有修复在等着处理。
  doorbell_light:
    name: 门铃灯
    description: 有人按门铃时打开走廊灯，每小时最多三次。
  morning_radio_volume:
    name: 早上收音机音量
    description: 七点半时把厨房音箱调小，前提是它在线。
  front_door_light:
    name: 前门打开时开走廊灯
    description: 用门口灯光蓝图创建。

