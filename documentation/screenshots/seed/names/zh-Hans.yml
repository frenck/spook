    description: Home Assistant 发现新东西时通知我。
    message: Home Assistant 发现了一个新设备。
  front_door_sensor_back:
    name: 前门传感器回来了
    description: 前门传感器离线一阵后重新工作时通知我。
    message: 前门传感器回来了。
