# Everything people read in the home of the screenshots, in Spanish. The keys
# and how it works: see en.yml. A name missing here is the English one.

home: La casa de Spook

area:
  # The names Home Assistant gives these when it is onboarded in Spanish.
  living_room: Salón
  kitchen: Cocina
  bedroom: Dormitorio
  hallway: Pasillo
  attic: Desván

floor:
  ground_floor: Planta baja
  first_floor: Primera planta
  basement: Sótano

