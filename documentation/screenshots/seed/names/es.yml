  night_light:
    name: Luz nocturna
    description: Se queda encendida por la noche.
  christmas:
    name: Navidad
    description: Las luces que salen en diciembre.

dashboard:
  title: Casa
  upstairs: Arriba
  # Home Assistant's own name for the default dashboard in Spanish.
  overview: Vista general

