  ghost_mood:
    name: Humor del fantasma
    options:
      friendly: Simpático
      spooky: Espeluznante
      sleepy: Dormilón

number:
  kitchen_fan_speed: Velocidad del extractor

zone:
  gym: Gimnasio

group:
  downstairs_lights: Luces de abajo

device_tracker:
  new_phone: Móvil nuevo

automation:
  hallway_light_at_sunset:
    name: Luz del pasillo al anochecer
    description: Enciende la luz del pasillo cuando se pone el sol.
  movie_night:
    name: Noche de cine
    description: Baja las luces del salón cuando la tele empieza a reproducir.
  weekday_morning_lights:
    name: Luces de las mañanas entre semana
    description: Las luces de la cocina a las seis y media entre semana, una vez.
  garage_lights_off_at_night:
    name: Garaje apagado por la noche
    description: Apaga todo el garaje a medianoche.
  doorbell_flash:
    name: Destello del timbre
    description: Hace parpadear el pasillo cuando alguien llama.
  automation_off_reminder:
    name: Automatización desactivada a mano
    description: Me avisa cuando alguien desactiva una automatización.
    message: Se ha desactivado una automatización. No olvides volver a activarla.
  new_device_found:
    name: Nuevo dispositivo encontrado
    description: Me avisa cuando Home Assistant descubre algo nuevo.
    message: Home Assistant ha encontrado un dispositivo nuevo.
  front_door_sensor_back:
    name: El sensor de la puerta ha vuelto
    description: Me avisa cuando el sensor de la puerta principal vuelve a funcionar tras un rato fuera.
    message: El sensor de la puerta principal ha vuelto.
  new_device_added:
    name: Nuevo dispositivo añadido
    description: Me avisa cuando se añade un dispositivo a la casa.
    message: Se ha añadido un dispositivo nuevo.
  living_room_sensor_quiet:
    name: Sensor del salón callado
    description: Me avisa cuando la temperatura del salón no cambia en una hora.
    message: El sensor de temperatura del salón se ha quedado callado. ¿La pila?
  new_integration:
    name: Nueva integración
    description: Me avisa cuando se añade una integración.
    message: Se ha añadido una integración nueva.
  integration_failed:
    name: Integración fallida
    description: Me avisa cuando una integración sigue sin arrancar tras un cuarto de hora.
    message: Una integración no arranca.
  blinds_down_lamp_on:
    name: Lámpara encendida al bajar las persianas
    description: Enciende la lámpara del salón en cuanto las persianas llegan al 30 %.
  repairs_news:
    name: Novedades en Reparaciones
    description: Me avisa cuando aparece una reparación seria, y cuando se resuelve una.
    message: Algo ha cambiado en Reparaciones.
  bedroom_warm:
    name: El dormitorio está caliente
    description: Me avisa cuando el termostato del dormitorio alcanza su temperatura.
    message: El dormitorio está caliente.
  hot_water_ready:
    name: Agua caliente para la ducha de la mañana
    description: A las siete, me dice si el termo está caliente.
    message: El agua caliente está lista.
  update_installed:
    name: Actualización instalada
    description: Me avisa cuando se instala una actualización.
    message: Se ha instalado una actualización.
  ghost_goes_to_sleep:
    name: El fantasma se va a dormir
    description: Manda al fantasma a la cama cuando empieza el script Buenas noches.
  door_opens_hallway_light:
    name: Luz del pasillo al abrir una puerta
    description: Enciende la luz del pasillo cuando se abre cualquier puerta.
  new_user:
    name: Nuevo usuario
    description: Me avisa cuando se añade un usuario a Home Assistant.
    message: Se ha añadido un usuario nuevo.
  welcome_home:
    name: Bienvenido a casa
    description: Lámpara del salón encendida cuando el móvil llega a casa y se abre la puerta, en menos de cinco minutos.
  door_settled:
    name: Pasillo apagado cuando la puerta se calma
    description: Apaga la luz del pasillo en cuanto la puerta principal lleva 30 segundos tranquila.
  coming_in:
    name: Entrando
    description: Lámpara del salón encendida cuando la puerta principal se abre y se vuelve a cerrar en menos de dos minutos.
  front_door_still_open:
    name: La puerta sigue abierta
    description: Me lo recuerda cada diez minutos mientras la puerta principal esté abierta.
    message: La puerta principal sigue abierta.
  nobody_up_yet:
    name: Nadie se ha levantado
    description: Me avisa cuando la luz de la cocina sigue apagada una hora después de las siete.
    message: Todavía no se ha levantado nadie.
  front_door_sensor_acting_up:
    name: El sensor de la puerta hace cosas raras
    description: Me avisa cuando el sensor de la puerta principal cambia cinco veces en cinco minutos.
    message: El sensor de la puerta principal no se estabiliza.
  blinds_down_when_warm:
    name: Persianas abajo cuando hace calor
    description: Baja las persianas del salón cuando allí hace más de 25 °C.
  lamp_off_by_itself:
    name: Lámpara apagada sola
    description: Me avisa cuando la lámpara del salón se apaga sin que nadie la toque.
    message: La lámpara del salón se ha apagado sola.
  spooky_surprise:
    name: Sorpresa espeluznante
    description: Algunas noches, una de cada cinco, el fantasma se pone espeluznante.
  follow_the_hallway:
    name: Seguir al pasillo
    description: Lámpara del salón encendida cuando la automatización del atardecer enciende el pasillo.
  morning_repairs_check:
    name: Repaso matinal de reparaciones
    description: A las nueve, me dice si hay algo serio esperando en Reparaciones.
    message: Hay reparaciones esperando.
  doorbell_light:
    name: Luz del timbre
    description: Enciende la luz del pasillo cuando llaman, tres veces por hora como mucho.
  morning_radio_volume:
    name: Volumen de la radio por la mañana
    description: Baja el altavoz de la cocina a las siete y media, si está.
  front_door_light:
    name: Luz del pasillo al abrir la puerta principal
    description: Hecha con el blueprint de luz en la puerta.

