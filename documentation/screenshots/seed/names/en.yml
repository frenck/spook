  new_timer: Pizza
  todo_item: Milk
  calibration: Living room temperature, corrected
  time_in_state: Front door closed since

# A word to search the Add action dialog for, the way somebody would type it
# to find Spook's actions of a topic. It comes from Spook's own translations
# of those actions. No English fallback here: a language without a word
# skips that shot, rather than searching German actions for an English word.
search:
  area: area
  floor: floor
  label: label
  input_number: input number
  number: number
  input_select: options
  person: device tracker
  zone: zone
  repairs: repair
