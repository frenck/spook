    description: Turns on a light when a door opens.
    new_description: Turns on a light when a door opens, and off again after a while.
    door: Door
    light: Light
    wait_time: Time before the light goes off again
  doorbell_flash:
    name: Flash a light when the doorbell rings
    description: Flashes a light once when somebody presses the doorbell.
    doorbell: Doorbell
    light: Light

