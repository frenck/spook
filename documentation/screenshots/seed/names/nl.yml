    name: Nieuwe gebruiker
    description: Laat het me weten als er een gebruiker bij komt in Home Assistant.
    message: Er is een nieuwe gebruiker toegevoegd.
  welcome_home:
    name: Welkom thuis
    description: Woonkamerlamp aan als de telefoon thuiskomt en de voordeur opengaat, binnen vijf minuten.
  door_settled:
    name: Ganglamp uit als de deur tot rust komt
    description: Zet de ganglamp uit zodra de voordeur 30 seconden met rust is gelaten.
  coming_in:
    name: Binnenkomen
    description: Woonkamerlamp aan als de voordeur opengaat en binnen twee minuten weer dicht.
  front_door_still_open:
    name: Voordeur staat nog open
    description: Herinnert me elke tien minuten zolang de voordeur openstaat.
    message: De voordeur staat nog open.
  nobody_up_yet:
    name: Nog niemand wakker
    description: Laat het me weten als de keukenverlichting een uur na zevenen nog uit is.
    message: Er is nog niemand op.
  front_door_sensor_acting_up:
    name: Voordeursensor doet raar
    description: Laat het me weten als de voordeursensor vijf keer in vijf minuten verandert.
    message: De voordeursensor komt niet tot rust.
  blinds_down_when_warm:
    name: Rolgordijnen dicht als het warm wordt
    description: Doet de rolgordijnen in de woonkamer dicht als het daar warmer wordt dan 25 °C.
  lamp_off_by_itself:
    name: Lamp vanzelf uitgegaan
    description: Laat het me weten als de woonkamerlamp uitgaat zonder dat iemand dat deed.
    message: De woonkamerlamp ging vanzelf uit.
  spooky_surprise:
    name: Griezelige verrassing
    description: Op sommige avonden, één op de vijf, wordt het spook griezelig.
  follow_the_hallway:
    name: Volg de gang
    description: Woonkamerlamp aan als de zonsondergangautomatisering de ganglamp aanzet.
  morning_repairs_check:
    name: Ochtendcontrole reparaties
    description: Laat me om negen uur weten of er iets ernstigs wacht onder Reparaties.
    message: Er wachten reparaties.
  doorbell_light:
    name: Licht bij de deurbel
    description: Zet de ganglamp aan als er wordt aangebeld, hooguit drie keer per uur.
  morning_radio_volume:
    name: Volume ochtendradio
    description: Zet de keukenspeaker om half acht zachter, als hij er is.
  front_door_light:
    name: Ganglamp als de voordeur opengaat
    description: Gemaakt van de blauwdruk voor licht bij een deur.

