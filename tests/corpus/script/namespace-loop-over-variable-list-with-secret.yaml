source: https://community.home-assistant.io/t/script-to-parse-battery-levels/641933
note: >-
  Script variables holding !secret values and a list of battery sensors, then
  a namespace loop with state_attr on the loop variable. The loop variable b
  shadows the secret variable b.
out_of_scope: >-
  Variables and for_each items are values somebody hands over. A literal
  under a reference key like entity_id is read; a plain string under a key
  of somebody's own is data until a template uses it, and Spook does not
  follow that use.
expect:
  entities:
    not_find: ["!secret household_email", sensor.front_door_battery]
  services:
    find: [notify.email_household]
---
alias: Low battery report
mode: single
variables:
  recipient_email: !secret household_email
  b: !secret household_phone
  battery_sensors:
    - sensor.front_door_battery
    - sensor.back_door_battery
    - sensor.garage_motion_battery
  output_message: |
    {% set ns = namespace(targets=[]) %}
    {% for b in battery_sensors %}
    {% set ns.targets = ns.targets + [state_attr(b, 'friendly_name') ~ ': ' ~ states(b) ~ '%'] %}
    {% endfor %}{{ ns.targets | join('\n') }}
sequence:
  - action: notify.email_household
    data:
      message: "{{ output_message }}"
      target:
        - "{{ recipient_email }}"
        - "{{ b }}"
