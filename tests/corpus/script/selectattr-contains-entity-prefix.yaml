source: https://github.com/frenck/spook/issues/1838
note: >-
  Target built from states.input_boolean filtered with selectattr contains and
  a partial entity ID. The quoted prefix is a search string, not an entity.
expect:
  entities:
    not_find: [input_boolean.vacuum_run, binary_sensor.rack]
  services:
    find: [input_boolean.turn_off]
---
alias: Stop every vacuum run flag
sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: >-
        {{ states.input_boolean
          | selectattr('entity_id', 'contains', 'input_boolean.vacuum_run')
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id')
          | list }}
  - action: persistent_notification.create
    data:
      message: >-
        {{ states.binary_sensor
          | rejectattr('entity_id', 'search', 'binary_sensor.rack')
          | selectattr('state', 'eq', 'on')
          | list | count }} sensors open
