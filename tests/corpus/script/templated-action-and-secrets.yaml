source: custom_components/spook/entity_filtering.py (async_filter_known_services) and Home Assistant's `!secret`
note: >-
  An action name built in a template is worked out while running, so it is
  no action to look up. A `!secret` in the data loads as plain text and is
  no reference. The light in the target still is.
expect:
  services:
    find: [light.turn_on]
    not_find: ["light.turn_{{ mode }}"]
  entities:
    find: [light.office]
    not_find: ["!secret office_webhook"]
---
alias: Office lights
fields:
  mode:
    name: Mode
    selector:
      select:
        options: ["on", "off"]
sequence:
  - action: "light.turn_{{ mode }}"
    target:
      entity_id: light.office
  - action: light.turn_on
    target:
      entity_id: light.office
  - action: rest_command.ping
    data:
      url: !secret office_webhook
