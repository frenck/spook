source: https://community.home-assistant.io/t/wait-for-trigger-not-working/605549
note: >-
  Script fields whose example values are entity IDs and sentences, a
  wait_for_trigger on an event with event_data, and wait.trigger.event.data
  read afterwards. The field example is documentation, and the speaker in the
  variables step is data until a template uses it.
expect:
  entities:
    not_find: [media_player.bedroom_speaker]
  services:
    find: [script.ask_actionable_question]
---
alias: Ask yes or no
fields:
  speaker:
    description: The speaker to ask on
    example: media_player.bedroom_speaker
sequence:
  - variables:
      device: media_player.living_room_speaker
  - action: script.ask_actionable_question
    data:
      text: Yes or no?
      event_id: yes_or_no
      speaker: "{{ device }}"
  - wait_for_trigger:
      - trigger: event
        event_type: actionable_notification_answer
        event_data:
          event_id: yes_or_no
    timeout:
      seconds: 10
  - variables:
      response_type: "{{ wait.trigger.event.data.event_response_type if wait.trigger else 'none' }}"
