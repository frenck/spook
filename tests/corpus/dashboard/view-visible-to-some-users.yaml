source: https://community.home-assistant.io/t/dashboard-user-visibility-not-working-through-ui-but-works-through-yaml/700315
note: >-
  Views shown to some users only, set by hand in YAML with `visible`. A user
  that is removed leaves the view hidden for everybody when it was the only
  one listed. A view with `visible: true` names nobody.
expect:
  users:
    find: [a1b2c3d4e5f60718293a4b5c6d7e8f90, b2c3d4e5f60718293a4b5c6d7e8f90a1]
  entities:
    find: [camera.driveway, alarm_control_panel.home]
---
views:
  - title: Cameras
    path: cameras
    visible:
      - user: a1b2c3d4e5f60718293a4b5c6d7e8f90
      - user: b2c3d4e5f60718293a4b5c6d7e8f90a1
    cards:
      - type: picture-entity
        entity: camera.driveway
  - title: Alarm
    path: alarm
    visible: true
    cards:
      - type: alarm-panel
        entity: alarm_control_panel.home
