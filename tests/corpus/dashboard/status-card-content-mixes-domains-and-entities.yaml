source: https://github.com/Wh1t3Rose/My-Home-Assistant/blob/main/cards/Phone-Dash-Room_Card.yaml
note: >-
  Custom status card whose content list mixes domains, an entity ID and
  domain plus device class labels, with entities named under hidden_entities
  and extra_entities, keys only this card knows. Next to an ordinary
  conditional card.
expect:
  entities:
    find: [binary_sensor.washer_door, sensor.washer_progress]
---
type: custom:vertical-stack-in-card
cards:
  - type: custom:status-card
    content:
      - light
      - input_boolean.bathroom_fan
      - fan
      - media_player
      - binary_sensor - moisture
      - binary_sensor - opening
    extra_entities:
      - input_boolean.bathroom_fan
    hidden_entities:
      - light.kitchen_spot_1
      - light.kitchen_spot_2
      - binary_sensor.pet_fountain_dispensing
    hide_person: false
    columns: 4
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.washer_door
        state: "off"
    card:
      type: custom:entity-progress-card
      entity: sensor.washer_progress
      name: Washer
