source: https://community.home-assistant.io/t/custom-button-card-how-can-label-custom-fields-height-set-automatically-to-fit-the-whole-content/614404/3
note: >-
  button-card with entities passed in through `variables` under names of its
  own (group_entity, scene_entity) and used from JavaScript. Real references
  under keys no walk knows, so both are missed.
---
type: custom:button-card
variables:
  group_entity: light.living_room
  scene_entity: scene.living_room_evening
  scene_name: Cosy
triggers_update: "[[[ return variables.group_entity; ]]]"
name: "[[[ return variables.scene_name; ]]]"
tap_action:
  action: perform-action
  perform_action: scene.turn_on
  target:
    entity_id: "[[[ return variables.scene_entity; ]]]"
