source: https://community.home-assistant.io/t/how-to-represent-an-input-number-with-state-dependent-icon-and-color/646319
note: >-
  Icon and colour per volume level through Jinja in card_mod over config.entity,
  once inline and once with the whole card_mod block moved into a !secret so many
  rows can share it (an opaque string here, never resolved), plus a Mushroom template card using config.entity.
expect:
  entities:
    find: [input_number.alarm_volume, input_number.doorbell_volume]
    not_find: [config.entity]
---
type: vertical-stack
cards:
  - type: entities
    entities:
      - entity: input_number.alarm_volume
        card_mod:
          style: |
            :host {
              --card-mod-icon:
                {% set volume = states(config.entity) | float(0) %}
                {% if volume == 0.0 %} mdi:volume-off
                {% elif volume <= 0.5 %} mdi:volume-medium
                {% else %} mdi:volume-high
                {% endif %};
            }
      - entity: input_number.doorbell_volume
        card_mod: !secret style_volume
  - type: custom:mushroom-template-card
    entity: input_number.alarm_volume
    primary: ""
    icon: |-
      {% set volume = states(config.entity) | float(0) %}
      {{ 'mdi:volume-off' if volume == 0 else 'mdi:volume-high' }}
    tap_action:
      action: more-info
