source: https://community.home-assistant.io/t/ha-sankey-chart-card-not-connecting-small-sized-entities/947695/3
note: >-
  Sankey chart: the parent rows are entity_id (read), but `children` is a list
  of plain entity IDs under a key no walk knows, so the leaves are missed.
  `remaining` is a pseudo row, not an entity.
expect:
  entities:
    find: [sensor.house_power, sensor.dishwasher_power]
---
type: custom:sankey-chart
show_units: true
sections:
  - entities:
      - entity_id: sensor.house_power
        name: Total
        children:
          - sensor.dishwasher_power
          - sensor.dryer_power
          - sensor.oven_power
        remaining:
          name: Other
  - entities:
      - entity_id: sensor.dishwasher_power
        children: []
      - type: entity
        entity_id: sensor.dryer_power
        children: []
