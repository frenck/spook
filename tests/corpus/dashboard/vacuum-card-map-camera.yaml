source: https://community.home-assistant.io/t/custom-vacuum-card-works-in-browser-not-in-app/581510/1
note: >-
  vacuum-card with its live map camera under `map`, a key of its own. The
  vacuum is read.
out_of_scope: >-
  Spook reads the keys every card shares (entity, entities, entity_id and
  friends) and the card shapes it claims, Bubble Card and the Mushroom
  template card's area. Keys a custom card invents for itself are not read.
expect:
  entities:
    find: [vacuum.downstairs]
    not_find: [camera.downstairs_live_map]
---
type: horizontal-stack
cards:
  - type: custom:vacuum-card
    entity: vacuum.downstairs
  - type: custom:vacuum-card
    entity: vacuum.downstairs
    map: camera.downstairs_live_map
    map_refresh: 1
    stats:
      default:
        - attribute: filter_left
          unit: hours
