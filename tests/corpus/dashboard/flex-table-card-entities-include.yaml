source: https://community.home-assistant.io/t/rest-api-sensor-for-openligadb/1013821/13
note: >-
  flex-table-card: `entities` is a mapping with include and exclude, each a
  pattern or a plain entity ID. A pattern is no entity, but the exact
  `include: sensor.league_table` is a real reference that is missed.
expect:
  entities:
    not_find: ["sensor.*_battery"]
---
type: vertical-stack
cards:
  - type: custom:flex-table-card
    entities:
      include: sensor.league_table
    columns:
      - name: Place
        data: result
  - type: custom:flex-table-card
    entities:
      include: sensor.*_battery
      exclude:
        - sensor.phone_battery
    columns:
      - name: Level
        data: state
