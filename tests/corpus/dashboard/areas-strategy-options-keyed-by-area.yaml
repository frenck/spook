source: https://github.com/home-assistant/frontend/blob/0e9b62e7d0d6d4aaf6ccf454202457a89fc643ee/src/panels/lovelace/strategies/areas/areas-dashboard-strategy.ts
note: >-
  The areas dashboard strategy, a core strategy whose `areas_display` Spook
  already reads. `areas_options` is a mapping keyed by area ID, and its
  `groups_options` hold entity IDs under `hidden` and `order`.
  `floors_display.order` holds floor IDs.
out_of_scope: >-
  The dashboard repairs check entities, areas and actions. Floors and labels
  on a dashboard have no repair.
expect:
  areas:
    find: [garage, kitchen, bedroom, office]
    not_find: [ground_floor]
  entities:
    find: [light.office_night_light, light.office_ceiling]
---
strategy:
  type: areas
  areas_display:
    hidden:
      - garage
    order:
      - kitchen
      - bedroom
  floors_display:
    order:
      - ground_floor
  areas_options:
    office:
      card_size: small
      groups_options:
        lights:
          hidden:
            - light.office_night_light
          order:
            - light.office_ceiling
            - light.office_desk_lamp
