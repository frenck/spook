source: https://github.com/thomasloven/lovelace-fold-entity-row
note: >-
  fold-entity-row also takes the head as a bare entity ID string, like a row
  in an entities card. The folded rows are found, they are ordinary rows.
out_of_scope: >-
  Spook reads the keys every card shares (entity, entities, entity_id and
  friends) and the card shapes it claims, Bubble Card and the Mushroom
  template card's area. Keys a custom card invents for itself are not read.
expect:
  entities:
    find: [light.porch, light.driveway]
    not_find: [light.outdoor_lights]
---
type: entities
entities:
  - type: custom:fold-entity-row
    head: light.outdoor_lights
    entities:
      - light.porch
      - light.driveway
