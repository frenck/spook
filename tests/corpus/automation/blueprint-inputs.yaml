source: Blueprint files as published, with `!input` tags (Spook commit 16e9c28d)
note: >-
  A blueprint body, not an automation: every reference is an `!input`. Home
  Assistant would not load this as an automation, so it is unavailable and
  only the trigger and condition readers look at it. Nothing tagged may come
  out as a reference.
expect:
  entities:
    not_find: ["!input motion_entity", "!input light_target"]
  triggers:
    find: [state]
---
blueprint:
  name: Motion light
  domain: automation
  input:
    motion_entity:
      name: Motion sensor
      selector:
        entity:
          domain: binary_sensor
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
triggers:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
actions:
  - action: light.turn_on
    target: !input light_target
  - wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        to: "off"
  - action: light.turn_off
    target: !input light_target
