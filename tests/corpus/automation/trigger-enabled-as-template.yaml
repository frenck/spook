source: https://www.home-assistant.io/docs/automation/trigger/#disabling-a-trigger
note: >-
  `enabled:` as a limited template on a trigger, from trigger_variables. It is
  not `false`, so the trigger counts as enabled for every reader.
expect:
  entities:
    find: [binary_sensor.garden_motion]
---
alias: Garden motion when enabled
trigger_variables:
  use_garden: true
triggers:
  - trigger: state
    entity_id: binary_sensor.garden_motion
    to: "on"
    enabled: "{{ use_garden }}"
actions:
  - action: light.turn_on
    target:
      entity_id: light.garden
