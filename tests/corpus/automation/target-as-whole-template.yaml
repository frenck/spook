source: https://community.home-assistant.io/t/custom-blinking-lights-blueprint/796494/5
note: >-
  `target:` given as one template string instead of a mapping, handing a
  variable through. The variable holds the lights under entity_id, but only
  as a value of a variable.
out_of_scope: >-
  Variables and for_each items are values somebody hands over. A literal
  under a reference key like entity_id is read; a plain string under a key
  of somebody's own is data until a template uses it, and Spook does not
  follow that use.
expect:
  services:
    find: [light.turn_on]
  entities:
    not_find: [light.kitchen, light.hallway]
---
alias: Blink lights
variables:
  lights:
    entity_id:
      - light.kitchen
      - light.hallway
triggers:
  - trigger: event
    event_type: doorbell_pressed
actions:
  - repeat:
      count: 3
      sequence:
        - action: light.turn_on
          target: "{{ lights }}"
          data:
            flash: short
        - delay: 1
