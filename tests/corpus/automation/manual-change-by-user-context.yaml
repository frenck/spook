source: https://community.home-assistant.io/t/setting-a-boolean-based-on-context-user-id/918789
note: >-
  Telling a change made by a person from one made by an automation through
  the context of the new state. Comparing the user behind it with one ID
  breaks quietly once that user is removed. The parent_id check carries no
  ID and leaves nothing to look up.
expect:
  users:
    find: [5e4d3c2b1a0948f7e6d5c4b3a2918070]
---
alias: Attic fan turned on by hand
triggers:
  - trigger: state
    entity_id: switch.attic_fan
    to: "on"
conditions:
  - condition: template
    value_template: "{{ trigger.to_state.context.parent_id is none }}"
actions:
  - if:
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id == '5e4d3c2b1a0948f7e6d5c4b3a2918070' }}
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.attic_fan_manual
