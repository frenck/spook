source: https://www.home-assistant.io/docs/scripts/#for-each
note: >-
  for_each over mappings where each item does call its entity `entity_id`.
  The walk treats each item like a step and reads it, which is right here.
expect:
  entities:
    find: [light.kitchen, light.hallway]
---
alias: Evening lights
triggers:
  - trigger: sun
    event: sunset
actions:
  - repeat:
      for_each:
        - entity_id: light.kitchen
          brightness_pct: 60
        - entity_id: light.hallway
          brightness_pct: 30
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ repeat.item.entity_id }}"
          data:
            brightness_pct: "{{ repeat.item.brightness_pct }}"
