source: https://community.home-assistant.io/t/edit-sequential-block-in-parallel-action-via-ui/612309
note: >-
  Parallel with one branch as an explicit `sequence:` block and one as a plain
  step. Home Assistant wraps the plain step in a sequence when validating, so
  both are read through the parallel branch.
expect:
  services:
    find: [media_player.volume_set, tts.speak, light.turn_on]
---
alias: Announce dinner
triggers:
  - trigger: state
    entity_id: input_button.dinner_ready
actions:
  - parallel:
      - sequence:
          - action: media_player.volume_set
            target:
              entity_id: media_player.kitchen
            data:
              volume_level: 0.6
          - action: tts.speak
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.kitchen
              message: Dinner is ready
      - action: light.turn_on
        target:
          entity_id: light.dining_room
