source: https://community.home-assistant.io/t/many-many-logs-from-homeassistant-helpers-template/983698/3
note: >-
  A raw block passes template text through unrendered: here it carries a
  states() call for whatever receives the payload. Home Assistant never looks
  that entity up in this automation, yet a literal in the raw text reads like
  any other quoted entity ID and is reported. Whether that is wrong depends on
  the receiver: an MQTT discovery value_template is rendered by Home Assistant
  later, so there it is a real, indirect reference.
---
alias: Push template to display
triggers:
  - trigger: homeassistant
    event: start
actions:
  - action: mqtt.publish
    data:
      topic: display/hallway/template
      payload: >-
        {% raw %}{{ states('sensor.hallway_display_text') }}{% endraw %}
