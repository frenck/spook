source: https://community.home-assistant.io/t/foreach-if-with-value-template-cannot-get-the-loop-variable-repeat-to-work/983884
note: >-
  for_each over a list of switch IDs, with the loop item written as
  states.repeat.state in a template. repeat is not a domain, so no entity is
  referenced there.
out_of_scope: >-
  Variables and for_each items are values somebody hands over. A literal
  under a reference key like entity_id is read; a plain string under a key
  of somebody's own is data until a template uses it, and Spook does not
  follow that use.
expect:
  entities:
    find: [input_text.expected_relay_state, counter.relay_mismatch]
    not_find: [repeat.state, switch.pump_shed_relay, switch.meter_box_relay]
---
alias: Count relays in the expected state
triggers:
  - trigger: time_pattern
    minutes: "/10"
actions:
  - action: counter.reset
    target:
      entity_id: counter.relay_mismatch
  - repeat:
      for_each:
        - switch.pump_shed_relay
        - switch.meter_box_relay
        - switch.orchard_relay
      sequence:
        - if:
            - condition: template
              value_template: >-
                {{ states.repeat.state == states.input_text.expected_relay_state.state }}
          then:
            - action: counter.increment
              target:
                entity_id: counter.relay_mismatch
