source: https://github.com/basnijholt/home-assistant-config/blob/main/automations/apple_watch.yaml
note: >-
  Triggers, conditions and actions as single mappings instead of lists, and a
  target whose domain is literal text while the object ID comes from an inline
  template. The attribute value check compares a source name.
expect:
  entities:
    find: [media_player.living_room_tv]
    not_find: [media_player.console]
  attributes:
    find:
      - media_player.living_room_tv: source
  services:
    find: [media_player.media_play_pause]
---
alias: Watch button toggles playback
triggers:
  trigger: event
  event_type: ios.action_fired
  event_data:
    actionName: Toggle TV
conditions:
  condition: state
  entity_id: media_player.living_room_tv
  state: "on"
actions:
  action: media_player.media_play_pause
  target:
    entity_id: >-
      media_player.{{ 'console' if is_state_attr('media_player.living_room_tv', 'source', 'Console') else 'living_room_tv' }}
